{% extends "layout.html" %}
{% from "partials/icons.html" import icon %}
{% block title %}RunwayEye · Test upload{% endblock %}
{% set active = "upload" %}
{% block page_title %}Test pe o poză sau un clip{% endblock %}
{% block content %}
<main class="px-4 py-4 sm:px-8 sm:py-6">
  <form class="panel max-w-5xl space-y-4 p-4 sm:p-5" hx-post="/upload" hx-encoding="multipart/form-data"
        hx-target="#upload-result" hx-indicator="#upload-busy" hx-disabled-elt="find button" x-data="{ name: '', over: false, clip: '' }">
    <label class="flex cursor-pointer flex-col items-center justify-center gap-2 rounded-box border-2 border-dashed px-4 py-10 text-center transition-colors"
           :class="over ? 'border-primary bg-primary/5' : 'border-line bg-base-200/50 hover:border-primary/60'"
           @dragover.prevent="over = true" @dragleave="over = false"
           @drop.prevent="over = false; $refs.file.files = $event.dataTransfer.files; name = $refs.file.files[0]?.name || ''">
      <span class="icon-tile size-12">{{ icon("upload", "size-6") }}</span>
      <span class="font-semibold" x-text="name || 'Alege sau trage aici o poză ori un clip'">Alege sau trage aici o poză ori un clip</span>
      <span class="text-xs text-base-content/70">O poză e verificată de detectorul de obiecte. Un clip (cel mult 2 minute) e comparat și cu pista curată.</span>
      <input x-ref="file" type="file" name="file" :required="!clip" accept="image/*,video/*" class="sr-only"
             @change="name = $event.target.files[0]?.name || ''; if (name) clip = ''">
    </label>

    {% if clips %}
    <label class="flex flex-wrap items-center gap-3 text-sm">
      <span class="font-semibold">sau un clip din bibliotecă</span>
      <select name="clip" x-model="clip" class="select select-sm min-w-0 flex-1 sm:max-w-sm"
              @change="if (clip) { $refs.file.value = ''; name = '' }">
        <option value="">Alege…</option>
        {% for c in clips %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>
    </label>
    {% endif %}

    <div class="grid gap-2 sm:grid-cols-2">
      <label class="flex cursor-pointer items-start gap-3 rounded-[16px] border border-line px-4 py-3 has-checked:border-primary has-checked:bg-primary/5">
        <input type="checkbox" name="use_calibration" value="true" class="checkbox checkbox-sm checkbox-primary mt-0.5">
        <span class="text-sm"><span class="font-semibold">Folosește calibrarea</span><span class="block text-base-content/70">Doar dacă e filmat din același loc</span></span>
      </label>
      <label class="flex cursor-pointer items-start gap-3 rounded-[16px] border border-line px-4 py-3 has-checked:border-error has-checked:bg-error/5">
        <input type="checkbox" name="send_alert" value="true" class="checkbox checkbox-sm checkbox-error mt-0.5">
        <span class="text-sm"><span class="font-semibold">Trimite ca incident real</span><span class="block text-base-content/70">Pornește alarma și intră în istoric</span></span>
      </label>
    </div>

    <div class="flex items-center justify-end gap-3">
      <span id="upload-busy" class="htmx-indicator flex items-center gap-2 text-sm text-base-content/70">
        <span class="loading loading-spinner loading-sm"></span> Analizez…
      </span>
      <button class="btn btn-primary min-w-40">Analizează</button>
    </div>
  </form>

  <div id="upload-result" class="mt-4 max-w-5xl" aria-live="polite"></div>
</main>
{% endblock %}
