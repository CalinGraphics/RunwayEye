<!doctype html>
<html lang="ro" data-theme="runway">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RunwayEye{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231769ff' stroke='%23ffffff' stroke-width='3'/><circle cx='16' cy='16' r='5' fill='%23ffffff'/></svg>">
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version() }}">
  <script src="/static/vendor/htmx.min.js?v={{ asset_version() }}" defer></script>
  <script src="/static/js/app.js?v={{ asset_version() }}"></script>
  {% block head %}{% endblock %}
  <script src="/static/vendor/alpine.min.js?v={{ asset_version() }}" defer></script>
</head>
<body class="{% block body_class %}min-h-screen bg-base-200 text-base-content{% endblock %}" {% block body_attrs %}{% endblock %}>
  {% block body %}{% endblock %}
</body>
</html>
