{% set links = [("/", "Command Center", "cc"), ("/incidents", "Istoric", "history"), ("/calibrate", "Calibrare", "calibrate"), ("/upload", "Test upload", "upload")] %}
<header class="flex flex-wrap items-center gap-x-4 gap-y-1 border-b border-base-300 bg-base-200 px-4 py-2">
  <a href="/" class="flex items-center gap-2.5" aria-label="RunwayEye, Command Center">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="font-semibold tracking-[0.2em] text-primary">RUNWAYEYE</span>
  </a>
  <span class="text-sm text-base-content/60">Pista <span class="readout text-base-content">{{ settings.runway_name }}</span></span>
  <nav class="ml-auto flex flex-wrap gap-1 text-sm" aria-label="Navigare">
    {% for href, label, key in links %}
    <a href="{{ href }}" class="btn btn-ghost btn-sm {{ 'btn-active' if active == key }}" {% if active == key %}aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>
</header>
